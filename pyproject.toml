[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm_te"
version = "0.1.0"
description = "LangGraph agent for generating system qualification test cases from system requirements"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
